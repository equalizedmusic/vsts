<!doctype html>
<html><head><meta charset="utf-8">
<!-- Reels MONTA-MONTA 1080x1920. Determinístico: window.render(t) desenha o instante t (s). Tempos em timeline.js (gen.py). -->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0e0f15}canvas{display:block}</style>
<script src="timeline.js"></script>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920, cv = document.getElementById('c'), g = cv.getContext('2d');
const DUR = TL.DUR, FPS = TL.FPS, SEG = Object.fromEntries(TL.segs.map(s => [s.id, s]));
const T0 = id => SEG[id].t0, T1 = id => SEG[id].t1;
const FONT = '"Segoe UI", Arial, sans-serif', BLACK = '"Segoe UI Black", "Segoe UI", Arial, sans-serif';
const C = { bg0: '#0e0f15', bg1: '#1b1d26', panel: '#13151c', line: '#2a2d38', ink: '#e9ecf5', dim: '#7d849c', faint: '#5d6276',
  gold: '#ffd23a', ok: '#5fe36a', vco: '#ff8a2a', vco2: '#ffa552', mixer: '#ffd23a', vcf: '#22d8ff', amp: '#5fe36a', out: '#ff4f8b', mod: '#b07bff' };

// ---------- imagens ----------
const IMGS = ['MONTAMONTA', 'QUIMERA', 'LIMAO', 'MERCURIO', 'RESENHA', 'GROOVADOR',
  'GRAO', 'CALEIDO', 'ESPIRAL', 'FITA', 'CHAMA', 'F1', 'RINGER', 'REPETECO', 'MIRAGEM', 'PICOTE',
  'PRISMA', 'TORNO', 'BARRAGEM', 'CONSOLE', 'SOCO', 'LIXA', 'HORIZONTE', 'SALA', 'MONITOR', 'NAVALHA',
  'FOLE', 'PICADOR', 'MARE', 'VAIVEM', 'REPIQUE', 'ECO', 'AVESSO', 'FREIO', 'ESCADA', 'MASTIGA'];
const IM = {};
for (const n of IMGS) { const i = new Image(); i.src = 'img/' + n + '.png'; IM[n] = i; document.body.appendChild(i); i.style.display = 'none'; }

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const eOut = u => 1 - Math.pow(1 - clamp(u), 3);
const back = u => { u = clamp(u); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const win = (t, a, b, f = .3) => clamp((t - a) / f) * clamp((b - t) / f);   // 0..1 dentro de [a,b] com rampas
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, col, align = 'left', weight = 700, font = FONT) {
  g.font = `${weight} ${size}px ${font}`; g.fillStyle = col; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function cover(img, x, y, w, h, cx = .5, cy = .5, vw = 1) {   // desenha a região (centro cx,cy; largura visível vw da foto) preenchendo x,y,w,h
  const iw = img.naturalWidth, ih = img.naturalHeight, sw = iw * vw, sh = sw * h / w;
  let sx = clamp(cx * iw - sw / 2, 0, iw - sw), sy = clamp(cy * ih - sh / 2, 0, Math.max(0, ih - sh));
  g.drawImage(img, sx, sy, sw, Math.min(sh, ih), x, y, w, Math.min(h, h * ih / sh));
}

// ---------- notas / envelope (mesmas regras do gen.py) ----------
function noteAt(t) { let r = null; for (const n of TL.notes) { if (n.t <= t && t < n.t + n.d + (n.m >= 2 ? .25 : .05)) r = n; } return r; }
function adsr(tt, gate, a, d, s, rel) {
  let e = tt < a ? tt / a : s + (1 - s) * Math.exp(-(tt - a) / d);
  if (tt >= gate) { const eg = gate < a ? gate / a : s + (1 - s) * Math.exp(-(gate - a) / d); e = eg * clamp(1 - (tt - gate) / rel); }
  return e;
}
function level(t) {
  const n = noteAt(t); if (!n) return 0; const tt = t - n.t;
  if (n.m === 1) return 1;
  return adsr(tt, n.d, .008, n.m === 2 ? .25 : .12, n.m === 2 ? .6 : .35, .25);
}
function cutU(t) { const c = TL.cut; if (t < c.a || t > c.b) return 1; return .5 + .5 * Math.cos(2 * Math.PI * (t - c.a) / (c.b - c.a)); }
function fcAt(t) {
  const n = noteAt(t); if (!n) return 2e4;
  if (n.m === 3) return 140 * Math.pow(2, cutU(t) * 6.4);
  if (n.m >= 4) { const fe = adsr(t - n.t, n.d, .003, n.m < 6 ? .11 : .09, 0, .1); return 260 + (n.m < 6 ? 3800 : 2600) * fe; }
  return 2e4;
}

// ---------- logo e cabeçalho ----------
function logo(x, y, s, a = 1) {
  g.save(); g.globalAlpha *= a;
  const q = [[C.vco, 0, 0], [C.vcf, 1, 0], [C.amp, 0, 1], [C.out, 1, 1]];
  for (const [c, i, j] of q) { rr(x + i * s * .52, y + j * s * .52, s * .48, s * .48, s * .1); g.fillStyle = c; g.fill(); }
  g.restore();
}
function header(t, a = 1) {
  g.save(); g.globalAlpha = a;
  logo(70, 120, 92);
  g.font = `900 78px ${BLACK}`; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = C.vco; g.fillText('MONTA', 190, 160); const w1 = g.measureText('MONTA').width;
  g.fillStyle = C.ink; g.fillRect(190 + w1 + 12, 154, 30, 12);
  g.fillStyle = C.vcf; g.fillText('MONTA', 190 + w1 + 54, 160);
  txt('INSIDE STUDIO SP  ·  FREE LEARNING SYNTH  ·  VST3 / AU', 192, 222, 24, C.dim, 'left', 700);
  g.restore();
}

// ---------- fundo ----------
function fundo(t) {
  g.fillStyle = C.bg0; g.fillRect(0, 0, W, H);
  const gr = g.createRadialGradient(W * .8, 300 + 80 * Math.sin(t * .3), 50, W * .8, 300, 900);
  gr.addColorStop(0, 'rgba(34,216,255,.10)'); gr.addColorStop(1, 'rgba(34,216,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const gr2 = g.createRadialGradient(W * .1, 1500, 50, W * .1, 1500, 900);
  gr2.addColorStop(0, 'rgba(255,138,42,.09)'); gr2.addColorStop(1, 'rgba(255,138,42,0)'); g.fillStyle = gr2; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,.025)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}

// ---------- knob ----------
function knob(x, y, r, u, col, label) {
  g.save();
  g.strokeStyle = '#2a2c34'; g.lineWidth = 3;
  for (let k = 0; k <= 10; k++) { const a = (-225 + 27 * k) * Math.PI / 180; g.beginPath();
    g.moveTo(x + Math.cos(a) * (r + 5), y + Math.sin(a) * (r + 5)); g.lineTo(x + Math.cos(a) * (r + 10), y + Math.sin(a) * (r + 10)); g.strokeStyle = '#4a4e5c'; g.stroke(); }
  g.beginPath(); g.arc(x, y, r + 14, -225 * Math.PI / 180, (-225 + 270 * u) * Math.PI / 180); g.strokeStyle = hexA(col, .9); g.lineWidth = 4; g.stroke();
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = '#121318'; g.fill();
  const gr = g.createRadialGradient(x - r * .3, y - r * .4, 1, x, y, r); gr.addColorStop(0, '#f4f5fa'); gr.addColorStop(1, '#777b8c');
  g.beginPath(); g.arc(x, y, r * .82, 0, 7); g.fillStyle = gr; g.fill();
  const a = (-225 + 270 * u) * Math.PI / 180;
  g.beginPath(); g.moveTo(x + Math.cos(a) * r * .25, y + Math.sin(a) * r * .25); g.lineTo(x + Math.cos(a) * r * .8, y + Math.sin(a) * r * .8);
  g.strokeStyle = col; g.lineWidth = 5; g.lineCap = 'round'; g.stroke();
  if (label) txt(label, x, y + r + 30, 19, '#c8ccd8', 'center', 700);
  g.restore();
}

// ---------- rack ----------
const COLW = 184, GAP = 9, RX = 64, TOPY = 430, TOPH = 340, BOTY = 782, BOTH = 210;
const colX = i => RX + i * (COLW + GAP);
const MODS = {
  VCO:    { nome: 'VCO', sub: 'OSCILLATOR', cor: C.vco, x: colX(0), y: TOPY, w: COLW, h: TOPH },
  MIXER:  { nome: 'MIXER', sub: 'MIXER', cor: C.mixer, x: colX(1), y: TOPY, w: COLW, h: TOPH },
  VCF:    { nome: 'VCF', sub: 'FILTER', cor: C.vcf, x: colX(2), y: TOPY, w: COLW, h: TOPH },
  ENVAMP: { nome: 'ENV AMP', sub: 'VOLUME', cor: C.amp, x: colX(3), y: TOPY, w: COLW, h: TOPH },
  OUT:    { nome: 'SAÍDA', sub: 'OUTPUT', cor: C.out, x: colX(4), y: TOPY, w: COLW, h: TOPH },
  VCO2:   { nome: 'VCO 2', sub: 'OSCILLATOR 2', cor: C.vco2, x: colX(1), y: BOTY, w: COLW, h: BOTH },
  ENVMOD: { nome: 'ENV MOD', sub: 'FILTER ENV', cor: C.mod, x: colX(2), y: BOTY, w: COLW, h: BOTH },
};
const ORDER = ['VCO', 'MIXER', 'VCF', 'ENVAMP', 'OUT', 'ENVMOD', 'VCO2'];
const placedAt = k => k === 'OUT' ? -1 : TL.snap[k];

function modBody(k, t, glow) {
  const m = MODS[k], { x, y, w, h, cor } = m;
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, '#3a3d47'); gr.addColorStop(1, '#1f2129');
  rr(x, y, w, h, 10); g.fillStyle = gr; g.fill();
  g.lineWidth = 3; g.strokeStyle = cor; g.stroke();
  if (glow > 0) { g.save(); g.shadowColor = cor; g.shadowBlur = 40 * glow; rr(x, y, w, h, 10); g.strokeStyle = hexA(cor, glow); g.lineWidth = 4; g.stroke(); g.restore(); }
  rr(x + 10, y + 10, w - 20, 52, 6); g.fillStyle = cor; g.fill();
  g.font = `800 28px ${FONT}`; const big = g.measureText(m.nome).width > w - 30;
  txt(m.nome, x + w / 2, y + 37, big ? 23 : 28, '#111318', 'center', 800);
  txt(m.sub, x + w / 2, y + 80, 15, '#8d93a8', 'center', 700);
  for (const [bx, by] of [[x + 16, y + h - 16], [x + w - 16, y + h - 16]]) { g.beginPath(); g.arc(bx, by, 6, 0, 7); g.fillStyle = '#9ea2b0'; g.fill(); }
  const cx = x + w / 2;
  if (k === 'VCO' || k === 'VCO2') {
    const big2 = k === 'VCO';
    knob(cx, y + 126, 27, .55, cor, null); txt('RANGE', cx, y + 184, 16, '#c8ccd8', 'center', 700);
    if (big2) {   // as 6 formas
      for (let i = 0; i < 6; i++) { const bx = x + 18 + i * 25; rr(bx, y + 204, 22, 22, 3); g.fillStyle = i === 3 ? cor : '#15161c'; g.fill(); g.strokeStyle = '#3a3e4c'; g.lineWidth = 1; g.stroke(); }
      knob(cx, y + 272, 21, .5, cor, null); txt('TUNE', cx, y + 314, 16, '#c8ccd8', 'center', 700);
    } else {
      const det = k === 'VCO2' ? .5 + .09 * eOut((t - TL.snap.VCO2 - .3) / 1.4) : .5;
      g.save(); g.translate(0, 0); knob(x + w - 46, y + 128, 20, det, cor, null); g.restore();
      txt('TUNE', x + w - 46, y + 172, 15, '#c8ccd8', 'center', 700);
      g.save(); knob(x + 50, y + 128, 20, .55, cor, null); g.restore(); txt('RANGE', x + 50, y + 172, 15, '#c8ccd8', 'center', 700);
    }
  } else if (k === 'MIXER') {
    knob(cx - 40, y + 140, 22, .75, cor, 'OSC 1'); knob(cx + 40, y + 140, 22, t > TL.snap.VCO2 ? .7 : 0, cor, 'OSC 2'); knob(cx, y + 255, 22, 0, cor, 'NOISE');
  } else if (k === 'VCF') {
    const u = t < TL.cut.a ? 1 : t <= TL.cut.b ? cutU(t) : .25;
    knob(cx, y + 150, 34, u, cor, 'CUTOFF');
    const cont = .7 * eOut((t - TL.snap.ENVMOD - .2) / 1.0);
    knob(cx - 44, y + 270, 20, .45, cor, null); txt('EMPH', cx - 44, y + 307, 15, '#c8ccd8', 'center', 700);
    knob(cx + 44, y + 270, 20, cont, cor, null); txt('CONTOUR', cx + 44, y + 307, 15, '#c8ccd8', 'center', 700);
  } else if (k === 'ENVAMP' || k === 'ENVMOD') {
    const amp = k === 'ENVAMP';
    const vals = amp ? [.08, .4, .6, .3] : [.03, .25, 0, .2], lab = ['A', 'D', 'S', 'R'];
    const y0 = amp ? y + 175 : y + 130;
    if (amp) {   // telinha do envelope
      rr(x + 18, y + 98, w - 36, 52, 6); g.fillStyle = '#07080b'; g.fill();
      g.beginPath(); g.moveTo(x + 26, y + 142); g.lineTo(x + 40, y + 106); g.lineTo(x + 70, y + 122); g.lineTo(x + w - 64, y + 122); g.lineTo(x + w - 28, y + 142);
      g.strokeStyle = cor; g.lineWidth = 3; g.stroke();
    }
    for (let i = 0; i < 4; i++) {
      const kx = x + 48 + (i % 2) * 88, ky = y0 + Math.floor(i / 2) * (amp ? 82 : 0) + (amp ? 0 : 0);
      if (amp) { knob(kx, ky, 20, vals[i], cor, null); txt(['ATTACK', 'DECAY', 'SUSTAIN', 'RELEASE'][i], kx, ky + 36, 14, '#c8ccd8', 'center', 700); }
      else { const kx2 = x + 30 + i * 41; knob(kx2, y0, 13, vals[i], cor, null); txt(lab[i], kx2, y0 + 30, 15, '#c8ccd8', 'center', 700); }
    }
  } else if (k === 'OUT') {
    const lv = level(t);
    const r = 52 * (1 + .06 * lv);
    g.beginPath(); g.arc(cx, y + 170, 58, 0, 7); g.fillStyle = '#0b0c10'; g.fill(); g.strokeStyle = '#3a3e4c'; g.lineWidth = 3; g.stroke();
    for (const k2 of [1, .7, .42]) { g.beginPath(); g.arc(cx, y + 170, r * k2, 0, 7); g.strokeStyle = k2 === 1 ? '#24262e' : '#3a3e4c'; g.lineWidth = 3; g.stroke(); }
    if (lv > 0) { g.beginPath(); g.arc(cx, y + 170, 58, 0, 7); g.strokeStyle = hexA(cor, .8 * lv); g.lineWidth = 4; g.stroke(); }
    knob(cx, y + 275, 20, .7, cor, null); txt('VOLUME', cx, y + 310, 15, '#c8ccd8', 'center', 700);
  }
}
function slot(k, t, estado) {   // estado: 'vazio' (encaixe aqui), 'ponte', 'trancado'
  const { x, y, w, h, cor, nome } = MODS[k];
  g.save(); rr(x + 4, y + 4, w - 8, h - 8, 10); g.fillStyle = 'rgba(10,11,15,.55)'; g.fill();
  if (estado === 'vazio') {
    g.setLineDash([12, 9]); g.lineDashOffset = -t * 30; g.strokeStyle = hexA(cor, .8); g.lineWidth = 3; g.stroke(); g.setLineDash([]);
    txt(nome, x + w / 2, y + h / 2 - 16, 30, hexA(cor, .9), 'center', 800); txt('fit here', x + w / 2, y + h / 2 + 18, 20, hexA(cor, .7), 'center', 600);
  } else if (estado === 'ponte') {
    g.strokeStyle = '#2c303d'; g.lineWidth = 2; g.stroke();
    txt('BRIDGE', x + w / 2, y + h / 2 - 50, 22, '#c8ccd8', 'center', 800); txt('sound passes', x + w / 2, y + h / 2 + 40, 16, C.faint, 'center', 600);
    g.beginPath(); g.moveTo(x + 14, y + h / 2); g.lineTo(x + w - 24, y + h / 2); g.strokeStyle = '#9aa0b4'; g.lineWidth = 3; g.stroke();
    g.beginPath(); g.moveTo(x + w - 14, y + h / 2); g.lineTo(x + w - 30, y + h / 2 - 9); g.lineTo(x + w - 30, y + h / 2 + 9); g.fillStyle = '#9aa0b4'; g.fill();
  } else {
    g.setLineDash([8, 8]); g.strokeStyle = '#30333f'; g.lineWidth = 2; g.stroke(); g.setLineDash([]);
    txt(nome, x + w / 2, y + h / 2 - 8, 24, '#555a6c', 'center', 800); txt('locked', x + w / 2, y + h / 2 + 22, 16, '#555a6c', 'center', 600);
  }
  g.restore();
}
// bandeja (chips) em cima do rack
const TRAY = ['VCO', 'MIXER', 'VCF', 'ENVAMP', 'OUT', 'ENVMOD', 'VCO2'];
const chip = i => ({ x: 56 + i * 140, y: 330, w: 130, h: 60 });
function tray(t) {
  txt('PARTS TRAY', 64, 300, 20, C.dim, 'left', 800); txt('drag into the rack', 222, 300, 18, C.faint, 'left', 600);
  TRAY.forEach((k, i) => {
    const c = chip(i), m = MODS[k], on = placedAt(k) <= t;
    const next = !on && nextPiece(t) === k;
    rr(c.x, c.y, c.w, c.h, 8); g.fillStyle = on ? '#1b1d26' : next ? hexA(m.cor, .18) : '#15161c'; g.fill();
    g.strokeStyle = on ? hexA(m.cor, .45) : next ? m.cor : '#2c2f3a'; g.lineWidth = next ? 3 : 2; g.stroke();
    rr(c.x + 8, c.y + 10, 8, c.h - 20, 3); g.fillStyle = on || next ? m.cor : '#30333f'; g.fill();
    txt(m.nome, c.x + 24, c.y + 22, m.nome.length > 5 ? 17 : 21, on ? hexA('#e9ecf5', .5) : next ? C.ink : '#555a6c', 'left', 800);
    txt(on ? '✓ in rack' : next ? 'drag me' : 'locked', c.x + 24, c.y + 44, 14, on ? C.ok : next ? m.cor : '#555a6c', 'left', 700);
  });
}
const DRAG = ['VCO', 'ENVAMP', 'VCF', 'ENVMOD', 'MIXER', 'VCO2'];
function nextPiece(t) { for (const k of DRAG) if (TL.snap[k] > t) return TL.snap[k] - t < 3.2 ? k : null; return null; }
function cursor(x, y, press) {
  g.save(); g.translate(x, y); g.scale(1.5, 1.5);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 26); g.lineTo(7, 20); g.lineTo(12, 31); g.lineTo(17, 29); g.lineTo(12, 18); g.lineTo(21, 18); g.closePath();
  g.fillStyle = '#fff'; g.fill(); g.strokeStyle = '#000'; g.lineWidth = 1.6; g.stroke();
  if (press) { g.beginPath(); g.arc(0, 0, 14, 0, 7); g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.stroke(); }
  g.restore();
}

// caminho do som + osciloscópio + teclado
function pathRow(t, y) {
  const chain = [['VCO', C.vco], ['MIXER', C.mixer], ['VCF', C.vcf], ['ENVAMP', C.amp], ['OUT', C.out]];
  txt('SIGNAL PATH', 64, y - 4, 20, C.dim, 'left', 800);
  const x0 = 120, dx = 205, yy = y + 52, lv = level(t);
  chain.forEach(([k, cor], i) => {
    const on = placedAt(k) <= t, cx = x0 + i * dx;
    if (i < chain.length - 1) { g.beginPath(); g.moveTo(cx + 26, yy); g.lineTo(cx + dx - 26, yy);
      const fl = placedAt(chain[i][0]) <= t && (placedAt('VCO') <= t);
      g.strokeStyle = fl ? hexA(cor, .5 + .5 * lv) : '#2a2d38'; g.lineWidth = 6; g.stroke(); }
    g.beginPath(); g.arc(cx, yy, 24, 0, 7); g.fillStyle = on ? cor : '#15161c'; g.fill();
    g.strokeStyle = on ? cor : (k === 'MIXER' ? '#3a3e4c' : hexA(cor, .6)); g.lineWidth = 3; g.setLineDash(on ? [] : [5, 5]); g.stroke(); g.setLineDash([]);
    if (on) { g.beginPath(); g.moveTo(cx - 9, yy); g.lineTo(cx - 2, yy + 8); g.lineTo(cx + 11, yy - 8); g.strokeStyle = '#111318'; g.lineWidth = 4; g.stroke(); }
    txt(MODS[k].nome, cx, yy + 44, 17, on ? C.ink : C.faint, 'center', 700);
  });
}
function scope(t, x, y, w, h) {
  rr(x, y, w, h, 12); g.fillStyle = '#07080b'; g.fill(); g.strokeStyle = '#2a2d38'; g.lineWidth = 2; g.stroke();
  txt('SCOPE', x + 16, y + 20, 15, C.dim, 'left', 800);
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 1;
  for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(x + i * w / 6, y); g.lineTo(x + i * w / 6, y + h); g.stroke(); }
  g.beginPath(); g.moveTo(x, y + h / 2); g.lineTo(x + w, y + h / 2); g.stroke();
  const n = noteAt(t); if (!n) return;
  const lv = level(t), fc = fcAt(t), f = 440 * Math.pow(2, (n.n - 69) / 12), cyc = 2.5;
  const det = n.m >= 5;
  let last = null, pts = [];
  for (let i = 0; i <= 300; i++) {
    const ph = i / 300 * cyc * 2 * Math.PI; let s = 0;
    for (let k = 1; k <= 40; k++) { const wgt = 1 / Math.sqrt(1 + Math.pow(k * f / fc, 8)); s += wgt * Math.sin(k * ph) / k;
      if (det) s += wgt * Math.sin(k * (ph * 1.0 + t * 3.0)) / k; }
    pts.push(s * (det ? .5 : 1));
  }
  const col = n.m >= 5 ? C.vco2 : n.m >= 4 ? C.mod : n.m >= 3 ? C.vcf : n.m >= 2 ? C.amp : C.vco;
  g.save(); g.shadowColor = col; g.shadowBlur = 16; g.beginPath();
  pts.forEach((s, i) => { const px = x + 10 + i / 300 * (w - 20), py = y + h / 2 - s * lv * h * .42; i ? g.lineTo(px, py) : g.moveTo(px, py); });
  g.strokeStyle = col; g.lineWidth = 4; g.stroke(); g.restore();
}
function teclado(t, x, y, w, h) {

  if (t > A - f && t < B + f) cenaFoto(t, win(t, A - f, B + f, f));
  if (t > B - f && t < Cc + f) cenaRack(t, win(t, B - f, Cc + f, f), 'licoes');
  if (t > Cc - f && t < D + f) cenaCartao(t, win(t, Cc - f, D + f, f));
  if (t > D - f && t < E + f) cenaRack(t, win(t, D - f, E + f, f), 'cabos');
  if (t > E - f && t < F) cenaQuero(t, win(t, E - f, F, f), T0('s10'));
  if (t > F) cenaCatalogo(t, clamp((t - F) / f));
  legenda(t);
  // fade de saída
  if (t > DUR - .6) { g.fillStyle = `rgba(0,0,0,${clamp((t - DUR + .6) / .6) * .9})`; g.fillRect(0, 0, W, H); }
};
window.DUR = DUR; window.FPS = FPS;
