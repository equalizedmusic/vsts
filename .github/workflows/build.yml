name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'shots/**', '.github/workflows/shots.yml', 'instrumentos/**', '.github/workflows/build-instrumentos.yml', '.github/workflows/limpar-releases.yml',
                   'divulgacao/**', 'plugins/knob/_comum/tools/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" 2>&1 | tee build.log
            cmake --build build --config Release -j 4 2>&1 | tee -a build.log
          else
            cmake -S . -B build -A x64 2>&1 | tee build.log
            cmake --build build --config Release --parallel 2>&1 | tee -a build.log
          fi

      - name: Empacotar
        id: pack
        run: |
          set -e
          mkdir -p dist
          # dist/ = todos; linha/<criativo|mix|knob>/ = só os da linha (vem de plugins/<linha>/<plugin>)
          for art in $(find build -type d -name '*_artefacts'); do
            linha=$(echo "$art" | sed -n 's#.*plugins/\([^/]*\)/[^/]*/.*#\1#p')
            for fmt in VST3 AU VST; do
              if [ -d "$art/Release/$fmt" ]; then
                mkdir -p "dist/$fmt" "linha/$linha/$fmt"
                cp -R "$art/Release/$fmt/." "dist/$fmt/"
                cp -R "$art/Release/$fmt/." "linha/$linha/$fmt/"
              fi
            done
          done
          find dist linha \( -name '*.exp' -o -name '*.lib' \) -delete
          if [ "${{ matrix.name }}" = mac ]; then
            for b in dist/*/* linha/*/*/*; do codesign --force --deep --sign - "$b"; done
          fi
          if [ "${{ matrix.name }}" = win ] && [ ! -e "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress > /dev/null
          fi
          # um instalador por linha: InsideStudioSP-Criativo-mac.dmg, InsideStudioSP-Mix-win.exe…
          if [ "${{ matrix.name }}" = mac ]; then PY=python3; else PY=python; fi
          # versão = o primeiro "## x.y.z" de novidades/<Linha>.md (a mesma que o CMake pôs nos plugins)
          export PYTHONIOENCODING=utf-8
          versao() { $PY instalador/versao.py "$1" | tr -d '\r'; }   # o python do Windows termina a linha com \r
          for d in linha/*; do
            l=$(basename "$d")
            P="$(echo "${l:0:1}" | tr a-z A-Z)${l:1}"
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote "$P" --origem "$d" --versao "$(versao "$P")" --saida .
          done
          { find dist linha -maxdepth 3; ls -l InsideStudioSP-*; } | tee pack.log

      - name: pluginval
        id: pluginval
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            PV=pluginval.app/Contents/MacOS/pluginval
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pv.zip > /dev/null
            PV=./pluginval.exe
          fi
          for p in dist/VST3/*.vst3; do
            "$PV" --strictness-level 5 --validate-in-process --timeout-ms 120000 "$p" 2>&1 | tee -a pluginval.log
          done

      - name: Relatório
        if: always()
        run: |
          mkdir -p report
          cp build.log     "report/build-${{ matrix.name }}.log"     2>/dev/null || true
          cp pack.log      "report/pack-${{ matrix.name }}.log"      2>/dev/null || true
          cp pluginval.log "report/pluginval-${{ matrix.name }}.log" 2>/dev/null || true
          cp InsideStudioSP-*-${{ matrix.name }}.* report/ 2>/dev/null || true
          echo "${{ matrix.name }}: build=${{ steps.build.outcome }} pacote=${{ steps.pack.outcome }} pluginval=${{ steps.pluginval.outcome }}" > "report/status-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: report/

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # só para ler novidades/ e instalador/versao.py
        with:
          path: src

      - uses: actions/download-artifact@v5
        with:
          path: report
          merge-multiple: true

      # os instaladores vão só para o release (limite de 2 GB por arquivo); o branch fica com logs e status,
      # porque o instalador do Mac pode passar dos 100 MB que o git do GitHub aceita por arquivo
      - name: Branch builds (logs + status)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pacotes
          mv report/*.dmg report/*.exe pacotes/ 2>/dev/null || true
          cd report
          { echo "commit=${GITHUB_SHA}"; echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; cat status-*.txt 2>/dev/null
            for p in Criativo Mix Knob; do echo "versao $(python3 ../src/instalador/versao.py $p --titulo)"; done; } > status.txt
          cat status.txt
          git init -q
          git checkout -q -b builds
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds

      # sem release "latest-build": em Releases fica só a última versão de cada pacote. O instalador de um build
      # sem versão nova fica nos artefatos do run (report-mac / report-win), na aba Actions.
      - name: Releases das versões (criativo-v…, mix-v…, knob-v…)
        if: hashFiles('pacotes/*') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash src/.github/scripts/release-versoes.sh pacotes report src Criativo Mix Knob
