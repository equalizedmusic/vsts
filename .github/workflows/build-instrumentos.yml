name: build-instrumentos

# Instrumentos (VSTi, pasta instrumentos/): build separado do pack de efeitos, só roda quando instrumentos/ muda.
# Logs no branch "builds-instrumentos"; instaladores do run nos artefatos (aba Actions).
# Versões: cada pacote tem novidades/<arquivo>.md; o primeiro "## x.y.z" é a versão (plugin + instalador). Quando
# ela é nova e os dois sistemas passaram, sai o release fixo "<pacote>-vx.y.z" com a seção como nota, e o release
# da versão anterior daquele pacote é apagado (em Releases fica só a última de cada um).
on:
  push:
    branches: [main]
    paths: ['instrumentos/**', 'instalador/**', 'novidades/Quimera.md', 'novidades/Limao.md', 'novidades/Mercurio.md', 'novidades/Resenha.md', 'novidades/MontaMonta.md', 'novidades/Groovador.md', 'novidades/Mesa.md',
            'licenca/cliente/**', '.github/workflows/build-instrumentos.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-instrumentos
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            cmake -S instrumentos -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" 2>&1 | tee build.log
            cmake --build build --config Release -j 4 2>&1 | tee -a build.log
          else
            cmake -S instrumentos -B build -A x64 2>&1 | tee build.log
            cmake --build build --config Release --parallel 2>&1 | tee -a build.log
          fi

      - name: Empacotar
        id: pack
        run: |
          set -e
          mkdir -p dist
          for art in $(find build -type d -name '*_artefacts'); do
            for fmt in VST3 AU; do
              if [ -d "$art/Release/$fmt" ]; then
                mkdir -p "dist/$fmt"
                cp -R "$art/Release/$fmt/." "dist/$fmt/"
              fi
            done
          done
          find dist \( -name '*.exp' -o -name '*.lib' \) -delete
          # LIMÃO, MERCÚRIO, RESENHA, MONTA-MONTA, GROOVADOR e MESA têm instalador próprio (não vão no pacote da QUIMERA)
          for fmt in VST3 AU; do
            for b in dist/$fmt/LIMAO.*; do
              if [ -e "$b" ]; then mkdir -p "dist-limao/$fmt"; mv "$b" "dist-limao/$fmt/"; fi
            done
            for b in dist/$fmt/MERCURIO.*; do
              if [ -e "$b" ]; then mkdir -p "dist-mercurio/$fmt"; mv "$b" "dist-mercurio/$fmt/"; fi
            done
            for b in dist/$fmt/RESENHA.*; do
              if [ -e "$b" ]; then mkdir -p "dist-resenha/$fmt"; mv "$b" "dist-resenha/$fmt/"; fi
            done
            for b in dist/$fmt/MONTA-MONTA.*; do
              if [ -e "$b" ]; then mkdir -p "dist-montamonta/$fmt"; mv "$b" "dist-montamonta/$fmt/"; fi
            done
            for b in dist/$fmt/GROOVADOR.*; do
              if [ -e "$b" ]; then mkdir -p "dist-groovador/$fmt"; mv "$b" "dist-groovador/$fmt/"; fi
            done
            for b in dist/$fmt/MESA.* dist/$fmt/MESA-CANAL.*; do   # MESA (console) e MESA CANAL
              if [ -e "$b" ]; then mkdir -p "dist-mesa/$fmt"; mv "$b" "dist-mesa/$fmt/"; fi
            done
          done
          if [ "${{ matrix.name }}" = mac ]; then
            for b in dist/*/* dist-limao/*/* dist-mercurio/*/* dist-resenha/*/* dist-montamonta/*/* dist-groovador/*/* dist-mesa/*/*; do if [ -e "$b" ]; then codesign --force --deep --sign - "$b"; fi; done
          fi
          if [ "${{ matrix.name }}" = win ] && [ ! -e "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress > /dev/null
          fi
          # QUIMERA: InsideStudioSP-Quimera-mac.dmg / -win.exe (até a 0.4.1 o pacote se chamava Instrumentos)
          if [ "${{ matrix.name }}" = mac ]; then PY=python3; else PY=python; fi
          export PYTHONIOENCODING=utf-8
          versao() { $PY instalador/versao.py "$1" | tr -d '\r'; }   # o python do Windows termina a linha com \r
          $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Quimera --origem dist --versao "$(versao Quimera)" --saida .
          # LIMÃO: InsideStudioSP-Limao-mac.dmg / -win.exe
          if [ -d dist-limao/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Limao --origem dist-limao --versao "$(versao Limao)" --saida .
          fi
          # MERCÚRIO: InsideStudioSP-Mercurio-mac.dmg / -win.exe
          if [ -d dist-mercurio/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Mercurio --origem dist-mercurio --versao "$(versao Mercurio)" --saida .
          fi
          # RESENHA: InsideStudioSP-Resenha-mac.dmg / -win.exe
          if [ -d dist-resenha/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Resenha --origem dist-resenha --versao "$(versao Resenha)" --saida .
          fi
          # MONTA-MONTA: InsideStudioSP-MontaMonta-mac.dmg / -win.exe
          if [ -d dist-montamonta/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote MontaMonta --origem dist-montamonta --versao "$(versao MontaMonta)" --saida .
          fi
          # GROOVADOR: InsideStudioSP-Groovador-mac.dmg / -win.exe
          if [ -d dist-groovador/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Groovador --origem dist-groovador --versao "$(versao Groovador)" --saida .
          fi
          # MESA: InsideStudioSP-Mesa-mac.dmg / -win.exe
          if [ -d dist-mesa/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Mesa --origem dist-mesa --versao "$(versao Mesa)" --saida .
          fi
          { find dist -maxdepth 2; find dist-limao dist-mercurio dist-resenha dist-montamonta dist-groovador dist-mesa -maxdepth 2 2>/dev/null; ls -l InsideStudioSP-*; } | tee pack.log

      - name: pluginval
        id: pluginval
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            PV=pluginval.app/Contents/MacOS/pluginval
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pv.zip > /dev/null
            PV=./pluginval.exe
          fi
          for p in dist/VST3/*.vst3 dist-limao/VST3/*.vst3 dist-mercurio/VST3/*.vst3 dist-resenha/VST3/*.vst3 dist-montamonta/VST3/*.vst3 dist-groovador/VST3/*.vst3 dist-mesa/VST3/*.vst3; do
            [ -e "$p" ] || continue
            "$PV" --strictness-level 5 --validate-in-process --timeout-ms 120000 "$p" 2>&1 | tee -a pluginval.log
          done

      - name: Relatório
        if: always()
        run: |
          mkdir -p report
          cp build.log     "report/build-${{ matrix.name }}.log"     2>/dev/null || true
          cp pack.log      "report/pack-${{ matrix.name }}.log"      2>/dev/null || true
          cp pluginval.log "report/pluginval-${{ matrix.name }}.log" 2>/dev/null || true
          cp InsideStudioSP-*-${{ matrix.name }}.* report/ 2>/dev/null || true
          echo "${{ matrix.name }}: build=${{ steps.build.outcome }} pacote=${{ steps.pack.outcome }} pluginval=${{ steps.pluginval.outcome }}" > "report/status-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: report/

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # só para ler novidades/ e instalador/versao.py
        with:
          path: src

      - uses: actions/download-artifact@v5
        with:
          path: report
          merge-multiple: true

      - name: Branch builds-instrumentos (logs + status)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pacotes
          mv report/*.dmg report/*.exe pacotes/ 2>/dev/null || true
          cd report
          { echo "commit=${GITHUB_SHA}"; echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; cat status-*.txt 2>/dev/null
            for p in Quimera Limao Mercurio Resenha MontaMonta Groovador Mesa; do echo "versao $(python3 ../src/instalador/versao.py $p --titulo)"; done; } > status.txt
          cat status.txt
          git init -q
          git checkout -q -b builds-instrumentos
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds-instrumentos

      # sem release "latest-instrumentos": em Releases fica só a última versão de cada pacote. O instalador de um
      # build sem versão nova fica nos artefatos do run (report-mac / report-win), na aba Actions.
      # RELEASE_TOKEN: o token automático toma 403 ao criar o release quando o commit mexe em .github/workflows
      - name: Releases das versões (quimera-v…, limao-v…, mercurio-v…, resenha-v…, montamonta-v…, groovador-v…, mesa-v…)
        if: hashFiles('pacotes/*') != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: bash src/.github/scripts/release-versoes.sh pacotes report src Quimera Limao Mercurio Resenha MontaMonta Groovador Mesa
