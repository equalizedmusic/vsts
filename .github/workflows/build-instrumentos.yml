name: build-instrumentos

# Instrumentos (VSTi, pasta instrumentos/): build separado do pack de efeitos, só roda quando instrumentos/ muda.
# Logs no branch "builds-instrumentos"; instaladores do run nos artefatos (aba Actions).
# Versões: cada pacote tem novidades/<arquivo>.md; o primeiro "## x.y.z" é a versão (plugin + instalador). Quando
# ela é nova e os dois sistemas passaram, sai o release fixo "<pacote>-vx.y.z" com a seção como nota, e o release
# da versão anterior daquele pacote é apagado (em Releases fica só a última de cada um).
on:
  push:
    branches: [main]
    # só a pasta de cada instrumento e o novidades dele; o job detectar escolhe QUAIS compilam (só os atualizados)
    paths: ['instrumentos/**', 'novidades/Quimera.md', 'novidades/Limao.md', 'novidades/Mercurio.md', 'novidades/Resenha.md', 'novidades/MontaMonta.md', 'novidades/Groovador.md', 'novidades/Mesa.md', 'novidades/Align.md', 'novidades/Onkey.md', 'novidades/Barebass.md', 'novidades/Stompbox.md', 'novidades/Maestro.md', 'novidades/Magos.md']
  workflow_dispatch:
    inputs:
      pacotes:
        description: 'Pacotes a compilar, separados por espaço (ex.: Limao Maestro) ou "todos"'
        required: true

permissions:
  contents: write

concurrency:
  group: build-instrumentos
  cancel-in-progress: true

jobs:
  # Só compila o que foi atualizado neste push (ver .github/scripts/pacotes-alterados.sh)
  detectar:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.d.outputs.dirs }}
      pacotes: ${{ steps.d.outputs.pacotes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          BASE: ${{ github.event.before }}
          ESCOLHA: ${{ github.event.inputs.pacotes }}
        run: bash .github/scripts/pacotes-alterados.sh instrumentos "$BASE" "$GITHUB_SHA" "$ESCOLHA" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: detectar
    if: needs.detectar.outputs.pacotes != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: mac }
          - { os: windows-latest, name: win }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Compilar
        id: build
        env:
          VSTS_SO: ${{ needs.detectar.outputs.dirs }}
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            cmake -S instrumentos -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DVSTS_SO=$VSTS_SO" 2>&1 | tee build.log
            cmake --build build --config Release -j 4 2>&1 | tee -a build.log
          else
            cmake -S instrumentos -B build -A x64 "-DVSTS_SO=$VSTS_SO" 2>&1 | tee build.log
            cmake --build build --config Release --parallel 2>&1 | tee -a build.log
          fi

      - name: Empacotar
        id: pack
        run: |
          set -e
          mkdir -p dist
          for art in $(find build -type d -name '*_artefacts'); do
            for fmt in VST3 AU; do
              if [ -d "$art/Release/$fmt" ]; then
                mkdir -p "dist/$fmt"
                cp -R "$art/Release/$fmt/." "dist/$fmt/"
              fi
            done
          done
          find dist \( -name '*.exp' -o -name '*.lib' \) -delete
          # LIMÃO, MERCÚRIO, RESENHA, MONTA-MONTA, GROOVADOR, MESA, ALIGN, ONKEY, BAREBASS, STOMPBOX, MAESTRO e MASTER DOS MAGOS têm instalador próprio (não vão no pacote da QUIMERA)
          for fmt in VST3 AU; do
            for b in dist/$fmt/LIMAO.*; do
              if [ -e "$b" ]; then mkdir -p "dist-limao/$fmt"; mv "$b" "dist-limao/$fmt/"; fi
            done
            for b in dist/$fmt/MERCURIO.*; do
              if [ -e "$b" ]; then mkdir -p "dist-mercurio/$fmt"; mv "$b" "dist-mercurio/$fmt/"; fi
            done
            for b in dist/$fmt/RESENHA.*; do
              if [ -e "$b" ]; then mkdir -p "dist-resenha/$fmt"; mv "$b" "dist-resenha/$fmt/"; fi
            done
            for b in dist/$fmt/MONTA-MONTA.*; do
              if [ -e "$b" ]; then mkdir -p "dist-montamonta/$fmt"; mv "$b" "dist-montamonta/$fmt/"; fi
            done
            for b in dist/$fmt/GROOVADOR.*; do
              if [ -e "$b" ]; then mkdir -p "dist-groovador/$fmt"; mv "$b" "dist-groovador/$fmt/"; fi
            done
            for b in dist/$fmt/MESA.* dist/$fmt/MESA-CANAL.*; do   # MESA (console) e MESA CANAL
              if [ -e "$b" ]; then mkdir -p "dist-mesa/$fmt"; mv "$b" "dist-mesa/$fmt/"; fi
            done
            for b in dist/$fmt/ALIGN.*; do
              if [ -e "$b" ]; then mkdir -p "dist-align/$fmt"; mv "$b" "dist-align/$fmt/"; fi
            done
            for b in dist/$fmt/ONKEY.*; do
              if [ -e "$b" ]; then mkdir -p "dist-onkey/$fmt"; mv "$b" "dist-onkey/$fmt/"; fi
            done
            for b in dist/$fmt/BAREBASS.*; do
              if [ -e "$b" ]; then mkdir -p "dist-barebass/$fmt"; mv "$b" "dist-barebass/$fmt/"; fi
            done
            for b in dist/$fmt/STOMPBOX.*; do
              if [ -e "$b" ]; then mkdir -p "dist-stompbox/$fmt"; mv "$b" "dist-stompbox/$fmt/"; fi
            done
            for b in dist/$fmt/MAESTRO.*; do
              if [ -e "$b" ]; then mkdir -p "dist-maestro/$fmt"; mv "$b" "dist-maestro/$fmt/"; fi
            done
            for b in dist/$fmt/MASTER-DOS-MAGOS.*; do
              if [ -e "$b" ]; then mkdir -p "dist-magos/$fmt"; mv "$b" "dist-magos/$fmt/"; fi
            done
          done
          if [ "${{ matrix.name }}" = mac ]; then
            for b in dist/*/* dist-limao/*/* dist-mercurio/*/* dist-resenha/*/* dist-montamonta/*/* dist-groovador/*/* dist-mesa/*/* dist-align/*/* dist-onkey/*/* dist-barebass/*/* dist-stompbox/*/* dist-maestro/*/* dist-magos/*/*; do if [ -e "$b" ]; then codesign --force --deep --sign - "$b"; fi; done
          fi
          if [ "${{ matrix.name }}" = win ] && [ ! -e "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress > /dev/null
          fi
          # QUIMERA: InsideStudioSP-Quimera-mac.dmg / -win.exe (até a 0.4.1 o pacote se chamava Instrumentos)
          if [ "${{ matrix.name }}" = mac ]; then PY=python3; else PY=python; fi
          export PYTHONIOENCODING=utf-8
          versao() { $PY instalador/versao.py "$1" | tr -d '\r'; }   # o python do Windows termina a linha com \r
          if [ -d dist/VST3 ] && [ -n "$(ls -A dist/VST3)" ]; then   # QUIMERA só quando ela foi compilada
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Quimera --origem dist --versao "$(versao Quimera)" --saida .
          fi
          # LIMÃO: InsideStudioSP-Limao-mac.dmg / -win.exe
          if [ -d dist-limao/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Limao --origem dist-limao --versao "$(versao Limao)" --saida .
          fi
          # MERCÚRIO: InsideStudioSP-Mercurio-mac.dmg / -win.exe
          if [ -d dist-mercurio/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Mercurio --origem dist-mercurio --versao "$(versao Mercurio)" --saida .
          fi
          # RESENHA: InsideStudioSP-Resenha-mac.dmg / -win.exe
          if [ -d dist-resenha/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Resenha --origem dist-resenha --versao "$(versao Resenha)" --saida .
          fi
          # MONTA-MONTA: InsideStudioSP-MontaMonta-mac.dmg / -win.exe
          if [ -d dist-montamonta/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote MontaMonta --origem dist-montamonta --versao "$(versao MontaMonta)" --saida .
          fi
          # GROOVADOR: InsideStudioSP-Groovador-mac.dmg / -win.exe
          if [ -d dist-groovador/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Groovador --origem dist-groovador --versao "$(versao Groovador)" --saida .
          fi
          # MESA: InsideStudioSP-Mesa-mac.dmg / -win.exe
          if [ -d dist-mesa/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Mesa --origem dist-mesa --versao "$(versao Mesa)" --saida .
          fi
          # ALIGN: InsideStudioSP-Align-mac.dmg / -win.exe
          if [ -d dist-align/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Align --origem dist-align --versao "$(versao Align)" --saida .
          fi
          # ONKEY: InsideStudioSP-Onkey-mac.dmg / -win.exe
          if [ -d dist-onkey/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Onkey --origem dist-onkey --versao "$(versao Onkey)" --saida .
          fi
          # BAREBASS: InsideStudioSP-Barebass-mac.dmg / -win.exe
          if [ -d dist-barebass/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Barebass --origem dist-barebass --versao "$(versao Barebass)" --saida .
          fi
          # STOMPBOX: InsideStudioSP-Stompbox-mac.dmg / -win.exe
          if [ -d dist-stompbox/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Stompbox --origem dist-stompbox --versao "$(versao Stompbox)" --saida .
          fi
          # MAESTRO: InsideStudioSP-Maestro-mac.dmg / -win.exe
          if [ -d dist-maestro/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Maestro --origem dist-maestro --versao "$(versao Maestro)" --saida .
          fi
          # MASTER DOS MAGOS: InsideStudioSP-Magos-mac.dmg / -win.exe
          if [ -d dist-magos/VST3 ]; then
            $PY instalador/montar.py --sistema ${{ matrix.name }} --pacote Magos --origem dist-magos --versao "$(versao Magos)" --saida .
          fi
          { find dist -maxdepth 2; find dist-limao dist-mercurio dist-resenha dist-montamonta dist-groovador dist-mesa dist-align dist-onkey dist-barebass dist-stompbox dist-maestro dist-magos -maxdepth 2 2>/dev/null || true; ls -l InsideStudioSP-*; } | tee pack.log

      - name: pluginval
        id: pluginval
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          if [ "${{ matrix.name }}" = mac ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
            unzip -q pv.zip
            PV=pluginval.app/Contents/MacOS/pluginval
          else
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
            7z x -y pv.zip > /dev/null
            PV=./pluginval.exe
          fi
          # Cada plugin é testado à parte: o pacote reprovado vai para pv-falhou.txt e só ele fica sem release
          # (release-versoes.sh). pv-fim.txt marca que o teste chegou ao fim; sem ele (pluginval não baixou, step
          # estourou o tempo) nenhum pacote sai, porque não dá para saber quem passou.
          : > pv-falhou.txt
          falha=0
          for par in dist:Quimera dist-limao:Limao dist-mercurio:Mercurio dist-resenha:Resenha dist-montamonta:MontaMonta dist-groovador:Groovador dist-mesa:Mesa dist-align:Align dist-onkey:Onkey dist-barebass:Barebass dist-stompbox:Stompbox dist-maestro:Maestro dist-magos:Magos; do
            d=${par%%:*}; pac=${par#*:}
            for p in "$d"/VST3/*.vst3; do
              [ -e "$p" ] || continue
              if ! "$PV" --strictness-level 5 --validate-in-process --timeout-ms 120000 "$p" 2>&1 | tee -a pluginval.log; then
                echo "$pac" >> pv-falhou.txt
                echo "::warning::pluginval reprovou $pac (${{ matrix.name }})"
                falha=1
              fi
            done
          done
          # RESENHA HUB: o ResenhaScan (leitor de plugins fora do DAW) tem que estar no bundle e ler o próprio RESENHA.
          # Se não ler, o RESENHA fica sem release (como reprovado no pluginval).
          for p in dist-resenha/VST3/RESENHA.vst3; do
            [ -e "$p" ] || continue
            if [ "${{ matrix.name }}" = mac ]; then SC="$p/Contents/Resources/ResenhaScan"; ALVO="$PWD/$p"; OUT="$PWD/scan.xml"
            else SC="$p/Contents/Resources/ResenhaScan.exe"; ALVO=$(cygpath -w "$PWD/$p"); OUT=$(cygpath -w "$PWD/scan.xml"); fi
            rm -f scan.xml
            code=0; timeout 120 "$SC" VST3 "$ALVO" "$OUT" || code=$?
            { echo "== ResenhaScan (${{ matrix.name }}): saida $code"; cat scan.xml 2>/dev/null; echo; } | tee -a pluginval.log
            if [ "$code" != 0 ] || ! grep -q 'name="RESENHA"' scan.xml 2>/dev/null; then
              echo "Resenha" >> pv-falhou.txt
              echo "::warning::ResenhaScan nao leu o RESENHA (${{ matrix.name }})"
              falha=1
            fi
          done
          echo fim > pv-fim.txt
          exit $falha

      - name: Relatório
        if: always()
        run: |
          mkdir -p report
          cp build.log     "report/build-${{ matrix.name }}.log"     2>/dev/null || true
          cp pack.log      "report/pack-${{ matrix.name }}.log"      2>/dev/null || true
          cp pluginval.log "report/pluginval-${{ matrix.name }}.log" 2>/dev/null || true
          cp pv-falhou.txt "report/pluginval-falhou-${{ matrix.name }}.txt" 2>/dev/null || true
          cp pv-fim.txt    "report/pluginval-fim-${{ matrix.name }}.txt"    2>/dev/null || true
          cp InsideStudioSP-*-${{ matrix.name }}.* report/ 2>/dev/null || true
          echo "${{ matrix.name }}: build=${{ steps.build.outcome }} pacote=${{ steps.pack.outcome }} pluginval=${{ steps.pluginval.outcome }}" > "report/status-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: report/

  publish:
    needs: [detectar, build]
    if: always() && needs.detectar.outputs.pacotes != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # só para ler novidades/ e instalador/versao.py
        with:
          path: src

      - uses: actions/download-artifact@v5
        with:
          path: report
          merge-multiple: true

      - name: Branch builds-instrumentos (logs + status)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pacotes
          mv report/*.dmg report/*.exe pacotes/ 2>/dev/null || true
          cd report
          { echo "commit=${GITHUB_SHA}"; echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; cat status-*.txt 2>/dev/null
            for p in Quimera Limao Mercurio Resenha MontaMonta Groovador Mesa Align Onkey Barebass Stompbox Maestro Magos; do echo "versao $(python3 ../src/instalador/versao.py $p --titulo)"; done; } > status.txt
          cat status.txt
          git init -q
          git checkout -q -b builds-instrumentos
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds-instrumentos

      # sem release "latest-instrumentos": em Releases fica só a última versão de cada pacote. O instalador de um
      # build sem versão nova fica nos artefatos do run (report-mac / report-win), na aba Actions.
      # RELEASE_TOKEN: o token automático toma 403 ao criar o release quando o commit mexe em .github/workflows
      - name: Releases das versões (quimera-v…, limao-v…, mercurio-v…, resenha-v…, montamonta-v…, groovador-v…, mesa-v…, align-v…, onkey-v…, barebass-v…, stompbox-v…, maestro-v…, magos-v…)
        if: hashFiles('pacotes/*') != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: bash src/.github/scripts/release-versoes.sh pacotes report src ${{ needs.detectar.outputs.pacotes }}
