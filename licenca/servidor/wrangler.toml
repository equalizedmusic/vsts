name = "isp-licencas"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Páginas do ALIGN e da VASSOURA no domínio do estúdio. O resto do domínio é o Worker do site (insidestudiosp-site).
routes = [
  { pattern = "insidestudiosp.com.br/align*", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/align*", zone_name = "insidestudiosp.com.br" },
  { pattern = "insidestudiosp.com.br/gratis/align/*", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/gratis/align/*", zone_name = "insidestudiosp.com.br" },
  { pattern = "insidestudiosp.com.br/vassoura*", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/vassoura*", zone_name = "insidestudiosp.com.br" },
  # downloads de todos os pacotes (links do e-mail da licença, do painel e das páginas); o site não usa /baixar
  { pattern = "insidestudiosp.com.br/baixar/*", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/baixar/*", zone_name = "insidestudiosp.com.br" },
  # painel de administração (página + /admin/* que ele chama); o www manda para o endereço sem www
  { pattern = "insidestudiosp.com.br/painel*", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/painel*", zone_name = "insidestudiosp.com.br" },
  { pattern = "insidestudiosp.com.br/admin/*", zone_name = "insidestudiosp.com.br" },
  # formulário de contato do site (a página /contato/ é do site; só o envio vem para cá)
  { pattern = "insidestudiosp.com.br/contato/enviar", zone_name = "insidestudiosp.com.br" },
  { pattern = "www.insidestudiosp.com.br/contato/enviar", zone_name = "insidestudiosp.com.br" },
]

[[d1_databases]]
binding = "DB"
database_name = "isp-licencas"
# preenchido depois do "npx wrangler d1 create isp-licencas" (o id não é segredo)
database_id = "4874b265-bdf3-448f-a23d-0fb2b68e2ff8"
